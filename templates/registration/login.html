{% extends "base.html" %}
{% block title %}Sign in · Workshop Pal{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Sign in</h1>
  {% if form.errors %}
    <p class="alert alert-error" role="alert">Username or password not recognised.</p>
  {% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input type="text" name="username" autocomplete="username" autocapitalize="none" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
