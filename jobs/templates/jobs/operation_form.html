{% extends "base.html" %}
{% block title %}Edit step · Workshop Pal{% endblock %}

{% block content %}
<section class="narrow-form">
  <p class="crumbs">
    <a href="{% url 'jobs:detail' operation.item.job.pk %}">{{ operation.item.job.reference }}</a> ›
    <a href="{% url 'jobs:item' operation.item.pk %}">{{ operation.item.name }}</a>
  </p>
  <h1>Edit step</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save step</button>
      <a class="btn btn-quiet" href="{% url 'jobs:item' operation.item.pk %}#route">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
